name: Refresh Full-Market Screen

on:
  workflow_dispatch:
  schedule:
    # 14:20 Asia/Taipei, Monday-Friday. GitHub cron is UTC.
    - cron: '20 6 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/scan_market.py'
      - '.github/workflows/market-scan.yml'

permissions:
  contents: write

concurrency:
  group: alpha-market-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run official TWSE + TPEx scanner
        id: scanner
        shell: bash
        run: |
          set +e
          python scripts/scan_market.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Sync alert state in validation workspace
        run: python scripts/sync_alert_state.py

      - name: Validate repository invariants
        run: |
          python -m py_compile scripts/*.py
          python scripts/validate.py
          python scripts/rebuild_performance.py --check

      - name: Commit scanner state and diagnostics
        run: |
          if ! git diff --quiet -- data/screen.json data/liquidity-history.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/screen.json data/liquidity-history.json
            git commit -m 'data: refresh full-market alpha screen'
            git push
          else
            echo 'No scanner changes.'
          fi

      - name: Fail workflow after diagnostics are persisted
        if: steps.scanner.outputs.exit_code != '0'
        run: |
          echo "Scanner exited with code ${{ steps.scanner.outputs.exit_code }}. Diagnostic source_health was persisted first."
          exit 1
