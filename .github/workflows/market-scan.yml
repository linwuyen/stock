name: Refresh Full-Market Screen

on:
  workflow_dispatch:
  schedule:
    # Two post-close attempts per trading weekday. GitHub cron is UTC and may be delayed.
    # 13:53 and 17:53 Asia/Taipei.
    - cron: '53 5 * * 1-5'
    - cron: '53 9 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/scan_market.py'
      - 'scripts/run_market_scan.py'
      - 'scripts/refine_screen.py'
      - 'scripts/validate_runtime.py'
      - 'scripts/validate_screen_priority.py'
      - 'scripts/validate_source_resilience.py'
      - '.github/workflows/market-scan.yml'

permissions:
  contents: write

concurrency:
  group: alpha-market-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run resilient official TWSE + TPEx scanner
        id: scanner
        shell: bash
        run: |
          set +e
          python scripts/run_market_scan.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enrich industry mapping and diversify Deep Research queue
        if: steps.scanner.outputs.exit_code == '0'
        run: python scripts/refine_screen.py

      - name: Validate repository invariants
        run: |
          python -m py_compile scripts/*.py
          python scripts/validate_runtime.py
          python scripts/validate_screen_priority.py
          python scripts/validate_source_resilience.py
          python scripts/rebuild_performance.py --check

      - name: Enforce scanner write scope
        shell: bash
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE '^data/(screen\.json|liquidity-history\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected scanner side effects; refusing to persist mixed state:'
            git status --short
            exit 1
          fi

      - name: Commit scanner state and diagnostics
        run: |
          if ! git diff --quiet -- data/screen.json data/liquidity-history.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/screen.json data/liquidity-history.json
            git commit -m 'data: refresh full-market alpha screen'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No scanner changes.'
          fi

      - name: Fail workflow after diagnostics are persisted
        if: steps.scanner.outputs.exit_code != '0'
        run: |
          echo "Scanner exited with code ${{ steps.scanner.outputs.exit_code }}. Diagnostic source_health was persisted first."
          exit 1
