name: Refresh Full-Market Screen V6

on:
  workflow_dispatch:
  schedule:
    - cron: '53 5 * * 1-5'
    - cron: '53 9 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/scan_market.py'
      - 'scripts/run_market_scan.py'
      - 'scripts/refine_screen.py'
      - 'scripts/normalize_screen_v5.py'
      - 'scripts/build_alpha.py'
      - 'scripts/build_alpha_v6.py'
      - 'scripts/sync_alert_state.py'
      - 'scripts/validate.py'
      - 'scripts/validate_screen_priority.py'
      - 'scripts/validate_source_resilience.py'
      - 'scripts/validate_transport_semantics.py'
      - '.github/workflows/market-scan.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: alpha-market-scan-v6
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run resilient official TWSE + TPEx scanner
        id: scanner
        shell: bash
        run: |
          set +e
          python scripts/run_market_scan.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Diversify Deep Research queue
        if: steps.scanner.outputs.exit_code == '0'
        run: python scripts/refine_screen.py

      - name: Normalize schema and rebuild security authority
        run: |
          python scripts/normalize_screen_v5.py
          python scripts/build_alpha_v6.py
          python scripts/sync_alert_state.py

      - name: Validate repository invariants
        run: |
          python -m py_compile scripts/*.py
          python scripts/validate.py
          python scripts/validate_screen_priority.py
          python scripts/validate_source_resilience.py
          python scripts/validate_transport_semantics.py
          python scripts/rebuild_performance.py --check
          find scripts -type d -name '__pycache__' -prune -exec rm -rf {} +

      - name: Enforce writer scope
        shell: bash
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE '^data/(screen\.json|liquidity-history\.json|alpha\.json|alerts\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected scanner side effects:'
            git status --short
            exit 1
          fi

      - name: Persist market and security decision state
        id: persist
        run: |
          echo 'pushed=false' >> "$GITHUB_OUTPUT"
          if ! git diff --quiet -- data/screen.json data/liquidity-history.json data/alpha.json data/alerts.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/screen.json data/liquidity-history.json data/alpha.json data/alerts.json
            git commit -m 'data: refresh screen and canonical security decisions'
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'pushed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No scanner changes.'
          fi

      - name: Dispatch dashboard validation and Pages deploy
        if: steps.persist.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Fail workflow after diagnostics are persisted
        if: steps.scanner.outputs.exit_code != '0'
        run: |
          echo "Scanner exited with code ${{ steps.scanner.outputs.exit_code }}. Fail-closed diagnostics were persisted first."
          exit 1
