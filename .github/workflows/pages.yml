name: Deploy Alpha Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/alpha.json').read_text())
          assert data['meta']['as_of']
          assert data['stocks']
          assert all(0 <= s['score'] <= 100 for s in data['stocks'])
          print(f"Validated {len(data['stocks'])} Alpha candidates")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
