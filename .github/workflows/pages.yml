name: Validate and Deploy Alpha Engine

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - '*.js'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - '*.js'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Static syntax
        run: |
          node --check engine.js
          node --check app.js
          node --check screen-v4.js
          python -m py_compile scripts/*.py
      - name: Evaluate alert transition state in validation workspace
        run: python scripts/sync_alert_state.py
      - name: Decision-engine invariants
        run: |
          python scripts/validate_runtime.py
          python scripts/validate_screen_priority.py
          python scripts/validate_source_resilience.py
      - name: Performance dataset consistency
        run: python scripts/rebuild_performance.py --check

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
