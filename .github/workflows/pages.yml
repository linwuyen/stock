name: Validate and Deploy Security Engine V5

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'v5.css'
      - '*.js'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'v5.css'
      - '*.js'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Static syntax
        run: |
          node --check engine.js
          node --check app-v5.js
          node --check app.js
          node --check screen-v4.js
          python -m py_compile scripts/*.py
      - name: Normalize migration snapshot and build canonical security decisions
        run: |
          python scripts/normalize_screen_v5.py
          python scripts/build_alpha.py
          python scripts/sync_alert_state.py
      - name: Security-engine invariants
        run: |
          python scripts/validate.py
          python scripts/validate_screen_priority.py
          python scripts/validate_source_resilience.py
          python scripts/validate_transport_semantics.py
      - name: Performance dataset consistency
        run: python scripts/rebuild_performance.py --check

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild canonical published decision artifacts
        run: |
          python scripts/normalize_screen_v5.py
          python scripts/build_alpha.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
